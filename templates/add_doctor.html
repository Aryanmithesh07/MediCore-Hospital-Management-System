{% extends "base.html" %}{% block title %}Add Doctor | MediCare{% endblock %}{% block content %}
<div class="page-head"><div><h1>Add Doctor</h1><p>Create a doctor profile.</p></div></div><div class="card-panel form-card"><form method="post"><div class="form-grid">
<div><label>Full Name *</label><input name="name" required></div><div><label>Specialization</label><input name="specialization" placeholder="e.g. Cardiology"></div>
<div><label>Department</label><input name="department"></div><div><label>Phone</label><input name="phone"></div>
<div><label>Email</label><input name="email" type="email"></div><div><label>Availability</label><input name="availability" placeholder="Mon-Fri 9 AM - 2 PM"></div>
</div><div class="form-actions"><a href="{{url_for('doctors')}}" class="btn btn-light">Cancel</a><button class="btn btn-primary">Add Doctor</button></div></form></div>{% endblock %}
