<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login | MediCare</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet"><link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet"></head>
<body class="login-page"><div class="login-card"><div class="login-logo"><i class="fa-solid fa-heart-pulse"></i></div><h2>MediCare Hospital</h2><p>Management System</p>
{% with messages=get_flashed_messages(with_categories=true) %}{% for c,m in messages %}<div class="alert alert-{{c}}">{{m}}</div>{% endfor %}{% endwith %}
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Username</label><div class="input-icon"><i class="fa-solid fa-user"></i><input name="username" class="form-control" autocomplete="username" required></div><label>Password</label><div class="input-icon"><i class="fa-solid fa-lock"></i><input name="password" type="password" class="form-control" autocomplete="current-password" required></div><button class="btn btn-primary w-100 mt-3"><i class="fa-solid fa-right-to-bracket"></i> Sign In</button></form><div class="demo">Initial administrator credentials are configured in the environment before the first launch.</div></div></body></html>
