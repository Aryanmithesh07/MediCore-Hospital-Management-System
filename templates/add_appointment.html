{% extends "base.html" %}{% block title %}Book Appointment | MediCare{% endblock %}{% block content %}
<div class="page-head"><div><h1>{{ 'Edit Appointment' if editing else 'Book Appointment' }}</h1><p>Schedule or update a patient visit.</p></div></div><div class="card-panel form-card"><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><div class="form-grid">
<div><label>Patient *</label><select name="patient_id" required><option value="">Select patient</option>{% for p in patients %}<option value="{{p.id}}" {% if appointment and appointment.patient_id==p.id %}selected{% endif %}>{{p.name}} — {{p.patient_code}}</option>{% endfor %}</select></div>
<div><label>Doctor *</label><select name="doctor_id" required><option value="">Select doctor</option>{% for d in doctors %}<option value="{{d.id}}" {% if appointment and appointment.doctor_id==d.id %}selected{% endif %}>{{d.name}} — {{d.specialization}}</option>{% endfor %}</select></div>
<div><label>Date *</label><input name="appointment_date" type="date" value="{{appointment.appointment_date if appointment else ''}}" {% if not editing %}min="{{today}}"{% endif %} required></div><div><label>Time *</label><input name="appointment_time" type="time" value="{{appointment.appointment_time if appointment else ''}}" required></div>
<div class="full"><label>Reason / Notes</label><textarea name="reason" rows="3">{{appointment.reason if appointment else ''}}</textarea></div>
</div><div class="form-actions"><a href="{{url_for('appointments')}}" class="btn btn-light">Cancel</a><button class="btn btn-primary">{{ 'Save Changes' if editing else 'Book Appointment' }}</button></div></form></div>{% endblock %}
