{% extends "base.html" %}{% block title %}Change Password | MediCare{% endblock %}{% block content %}<div class="page-head"><div><h1>Change password</h1><p>Use a unique password with at least 12 characters.</p></div></div><div class="card-panel form-card"><form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token}}"><label>Current password</label><input name="current_password" type="password" autocomplete="current-password" required><label class="mt-3">New password</label><input name="new_password" type="password" minlength="12" autocomplete="new-password" required><label class="mt-3">Confirm new password</label><input name="confirm_password" type="password" minlength="12" autocomplete="new-password" required><button class="btn btn-primary mt-3">Update password</button></form></div>{% endblock %}
